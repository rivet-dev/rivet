[package]
name = "rivetkit-host-adapter"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
workspace = "../../../"
description = "Binding-independent host logic for RivetKit actors: the event loop, hooks, timeouts, streams, and the wire protocol foreign-language bindings share"

[features]
default = ["wire"]
# The byte-level protocol used by C ABI bindings (rivetkit-ffi). Hosts that call
# the `HostActor` trait directly (napi, the Rust SDK) do not need it.
wire = ["dep:ciborium", "dep:serde_bytes", "dep:rivetkit-client", "dep:http", "dep:tungstenite"]
# Embed SQLite instead of routing it through the engine.
sqlite-local = ["rivetkit-core/sqlite-local"]

[dependencies]
anyhow.workspace = true
bytes.workspace = true
ciborium = { workspace = true, optional = true }
futures.workspace = true
http = { workspace = true, optional = true }
parking_lot.workspace = true
rivet-error.workspace = true
rivetkit-client = { workspace = true, optional = true }
rivetkit-core.workspace = true
serde.workspace = true
serde_bytes = { workspace = true, optional = true }
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tungstenite = { version = "0.26.2", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
