# Generates include/rivetkit.h. Run `mise run bindings` from rivetkit-java/.
language = "C"
header = "/* Generated by cbindgen from rivetkit-ffi. Do not edit. */"
include_guard = "RIVETKIT_H"
usize_is_size_t = true
documentation = true
documentation_style = "c99"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]

[export]
# The wire protocol's enums live in rivetkit-host-adapter.
include = ["EventKind", "Op", "Status"]
exclude = ["STATUS_OK", "STATUS_ERROR", "EventFn", "CompleteFn"]

[export.rename]
"EventCallback" = "rivet_event_cb"
"CompleteCallback" = "rivet_complete_cb"
"EventKind" = "rivet_event_kind"
"Op" = "rivet_op"
"Status" = "rivet_status"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = true
include = ["rivetkit-host-adapter"]
