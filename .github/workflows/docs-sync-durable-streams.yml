name: Sync docs (durable-streams)

# The Durable Streams docs at rivet.dev/durable-streams/docs.
on:
  push:
    branches: [main]
    paths:
      - "docs/durable-streams/**"
      - "examples/docs/durable-streams/**"
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'rivet-dev/rivet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rivet-dev/rivet-website/.github/actions/sync-docs@main
        with:
          product: durable-streams
          source: docs/durable-streams
          token: ${{ secrets.RIVET_WEBSITE_TOKEN }}
          extra-paths: >-
            examples/docs/durable-streams
