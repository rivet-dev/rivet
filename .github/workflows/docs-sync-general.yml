name: Sync docs (general)

# The product-agnostic docs published at rivet.dev/docs. They live here rather
# than in the website repo because their snippets and generated schemas are
# built in this repo.
on:
  push:
    branches: [main]
    paths:
      - "docs/general/**"
      - "examples/docs/**"
      - "self-host/workers/**"
      - "self-host/control-plane/**"
      - "engine/artifacts/**"
      - "rivetkit-openapi/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rivet-dev/rivet-website/.github/actions/sync-docs@main
        with:
          product: docs
          source: docs/general
          token: ${{ secrets.RIVET_WEBSITE_TOKEN }}
          extra-paths: >-
            examples/docs
            self-host/workers
            self-host/control-plane
            engine/artifacts/config-schema.json
            rivetkit-openapi/openapi.json
