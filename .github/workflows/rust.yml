name: Rust CI
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    # Enable fail-fast behavior
    shell: bash -e {0}
env:
  RUSTFLAGS: "--cfg tokio_unstable"
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # clippy:
  #   name: Clippy
  #   runs-on: depot-ubuntu-24.04-8
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions-rust-lang/setup-rust-toolchain@v1
  #       with:
  #         toolchain: stable
  #         components: clippy
  #
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         shared-key: "rust-ci"
  #         cache-on-failure: true
  #
  #     - name: Run clippy
  #       run: cargo clippy --all-targets --all-features -- -W warnings

  check:
    name: Check
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-shared-key: rust-ci
          cache-on-failure: true

      - name: Set up repository-specific Rust dependencies
        if: ${{ hashFiles('scripts/ci/pre-rust-check.sh') != '' }}
        run: scripts/ci/pre-rust-check.sh

      - name: Check event-driven drain invariants
        run: rivetkit-rust/packages/rivetkit-core/scripts/check-event-driven-drains.sh

      - name: Check
        run: cargo check --workspace --exclude rivetkit-wasm
        env:
          # Deny warnings
          RUSTFLAGS: --cfg tokio_unstable -D warnings -A unsafe-op-in-unsafe-fn

      - name: Check Rust publish surface
        run: |
          cargo check -p rivetkit --no-default-features --features rivetkit-core/sqlite-remote
          if cargo tree -e normal -p rivetkit --no-default-features --features rivetkit-core/sqlite-remote | grep -i 'git+'; then
            echo "published rivetkit feature set must not contain git dependencies" >&2
            exit 1
          fi
          cargo publish -p rivet-error-macros --dry-run

  # test:
  #   name: Test
  #   runs-on: depot-ubuntu-24.04-8
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions-rust-lang/setup-rust-toolchain@v1
  #       with:
  #         toolchain: stable
  #
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         # Share cache across all Rust jobs
  #         shared-key: "rust-ci"
  #         # Save cache even if the build fails
  #         cache-on-failure: true
  #         # Only save cache on main branch to avoid cache pollution from PRs
  #
  #     - name: Run tests
  #       run: cargo test --verbose
  #
  # deny:
  #   name: Deny
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: cargo deny
  #       uses: EmbarkStudios/cargo-deny-action@v1
  #       with:
  #         rust-version: "1.88.0"

  # This job always runs and should be the required status check
  status-check:
    name: Rust CI Status
    runs-on: ubuntu-latest
    needs: [fmt, check]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] || [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi

          echo "All Rust checks passed"
