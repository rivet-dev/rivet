name: Rust CI
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    # Enable fail-fast behavior
    shell: bash -e {0}
env:
  RUSTFLAGS: "--cfg tokio_unstable"
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # clippy:
  #   name: Clippy
  #   runs-on: depot-ubuntu-24.04-8
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: actions-rust-lang/setup-rust-toolchain@v1
  #       with:
  #         toolchain: stable
  #         components: clippy
  #
  #     - uses: Swatinem/rust-cache@v2
  #       with:
  #         shared-key: "rust-ci"
  #         cache-on-failure: true
  #
  #     - name: Run clippy
  #       run: cargo clippy --all-targets --all-features -- -W warnings

  check:
    name: Check
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache-shared-key: rust-ci
          cache-on-failure: true

      - name: Check event-driven drain invariants
        run: rivetkit-rust/packages/rivetkit-core/scripts/check-event-driven-drains.sh

      - name: Check
        run: cargo check --workspace --exclude rivetkit-wasm
        env:
          # Deny warnings
          RUSTFLAGS: --cfg tokio_unstable -D warnings -A unsafe-op-in-unsafe-fn

      # The RivetError macros write engine/artifacts/errors/*.json while
      # compiling. Those files feed the published error codes reference
      # (docs/api/error-registry.json), so a commit that changes an error
      # without committing the artifact would publish stale docs.
      - name: Check error artifacts are committed
        run: |
          if [ -n "$(git status --porcelain engine/artifacts/errors)" ]; then
            git status --porcelain engine/artifacts/errors
            echo "::error::engine/artifacts/errors changed during cargo check. Run cargo check and commit the artifacts, then run pnpm docs:gen-api."
            exit 1
          fi

      - name: Check Rust publish surface
        run: |
          cargo publish -p rivet-error-macros --dry-run

  # deny:
  #   name: Deny
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: cargo deny
  #       uses: EmbarkStudios/cargo-deny-action@v1
  #       with:
  #         rust-version: "1.88.0"

  # This job always runs and should be the required status check
  status-check:
    name: Rust CI Status
    runs-on: ubuntu-latest
    needs: [fmt, check]
    if: always()
    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.fmt.result }}" != "success" ] || [ "${{ needs.check.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi

          echo "All Rust checks passed"
