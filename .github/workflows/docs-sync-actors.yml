name: Sync docs (actors)

# Docs live here; rivet.dev publishes them. On merge to main this copies the
# docs/actors bundle into the website's vendor/actors and opens a PR there,
# which is also what triggers the site rebuild.
on:
  push:
    branches: [main]
    paths:
      - "docs/actors/**"
      - "examples/docs/**"
      - "examples/workflow-sdk/**"
      - "rivetkit-typescript/artifacts/**"
      - "rivetkit-typescript/packages/rivetkit/package.json"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rivet-dev/rivet-website/.github/actions/sync-docs@main
        with:
          product: actors
          source: docs/actors
          token: ${{ secrets.RIVET_WEBSITE_TOKEN }}
          extra-paths: >-
            examples/docs
            examples/workflow-sdk
            rivetkit-typescript/artifacts
            rivetkit-typescript/packages/rivetkit/package.json
