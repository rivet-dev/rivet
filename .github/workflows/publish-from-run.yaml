name: publish-from-run

on:
  workflow_call:
    inputs:
      source_run_id:
        required: true
        type: string
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Completed publish workflow run containing build artifacts"
        required: true
        type: string
      version:
        description: "Prerelease version to publish"
        required: true
        type: string

jobs:
  publish:
    name: "Publish"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      packages: read
      actions: read
    steps:
      - name: Refuse to publish outside the OSS repository
        if: github.repository_id != '654560183'
        run: |
          echo "::error::publish-from-run.yaml only publishes from rivet-dev/rivet (repository ID 654560183), not ${{ github.repository }}."
          exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Resolve source run SHA
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "sha=$(gh api repos/${{ github.repository }}/actions/runs/${{ inputs.source_run_id }} --jq '.head_sha[0:7]')" >> "$GITHUB_OUTPUT"
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter=publish
      - uses: ./.github/actions/docker-setup
        if: github.repository_id == '654560183'
        with:
          docker_username: ${{ secrets.DOCKER_CI_USERNAME }}
          docker_password: ${{ secrets.DOCKER_CI_ACCESS_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker multi-arch manifests
        if: github.repository_id == '654560183'
        run: pnpm --filter=publish exec tsx src/ci/bin.ts docker-manifest --sha ${{ steps.source.outputs.sha }}

      - name: Retag Docker manifests to version
        if: github.repository_id == '654560183'
        run: |
          pnpm --filter=publish exec tsx src/ci/bin.ts docker-retag \
            --sha ${{ steps.source.outputs.sha }} \
            --version ${{ inputs.version }} \
            --latest false
