# Every test uses fresh actor keys, so tests run concurrently against one engine.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = concurrent
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = fixed
junit.jupiter.execution.parallel.config.fixed.parallelism = 4
# A hang is a bug: fail fast instead of waiting for the Gradle timeout.
junit.jupiter.execution.timeout.default = 20 s
# Lifecycle methods start the engine and warm up the pool.
junit.jupiter.execution.timeout.beforeall.method.default = 120 s
