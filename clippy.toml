# Shared across workspace crates: Clippy searches upward from each crate's
# manifest directory. Keep one root config so these rules cannot drift between
# packages and new crates inherit the same environment boundary.
#
# Clocks, randomness, task spawning, and selection must go through rivet-env so
# production code can also run under deterministic simulation. Unordered
# collections and direct runtime APIs can make replay depend on the host.
# Keep exceptions local to env adapters or telemetry-only clock reads.
# Metrics intentionally use real time, including during simulation.
# Moving these rules to the root also exposes violations in unmigrated crates.

