catalog:
  drizzle-orm: "0.45.2"
  drizzle-zod: "0.8.3"

packages:
  - engine
  - engine/sdks/typescript/api-full
  - engine/sdks/typescript/envoy-protocol
  - examples/*
  - integrations/*
  - integrations/*/examples/*
  - rivetkit-typescript/packages/*
  - rivetkit-swift/examples/*/server
  - scripts/publish
  - shared/typescript/*
  # Serverless is disabled for v3; keep these sources for a later release.
  - '!rivetkit-typescript/packages/cloudflare-workers'
  - '!rivetkit-typescript/packages/supabase'
  - '!rivetkit-typescript/packages/next-js'
  - '!examples/ai-and-user-generated-actors-freestyle'
  - '!examples/custom-serverless'
  - '!examples/hello-world-cloudflare-workers*'
  - '!examples/hello-world-supabase-functions'
  - '!examples/next-js'
  - '!examples/ai-generated-actor'
  - '!examples/chat-room-render'
  - '!examples/dynamic-actors'
  - '!examples/elysia'
  - '!examples/hello-world-render'
  - '!examples/hono'
  - '!examples/hono-react'
  - '!examples/raw-fetch-handler'
  - '!examples/raw-websocket-handler-proxy'
  - '!examples/react-render'
  - '!examples/state-render'
  - '!examples/stream-render'
  - '!examples/trpc'
  - '!examples/sandbox'
  - '!examples/multiplayer-game'
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - browser-tabs-lock
  - core-js

onlyBuiltDependencies:
  - '@biomejs/biome'
  - opencode-ai
  - bcrypt
  - better-sqlite3
  - cbor-extract
  - esbuild
  - lefthook
  - sharp
  - workerd
