[package]
edition = "2021"
name = "slatedb"
version = "0.17.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A cloud native embedded storage engine built on object storage."
homepage = "https://slatedb.io"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/slatedb/slatedb"

[features]
all = [
    "aws",
    "azure",
    "compression",
    "gcp",
    "snappy",
    "zlib",
    "lz4",
    "zstd",
    "wal_disable",
    "foyer",
    "moka",
    "test-util",
]
aws = ["object_store/aws"]
azure = ["object_store/azure"]
bench-internal = []
bencher = [
    "aws",
    "azure",
    "wal_disable",
    "foyer",
]
compaction_filters = []
compression = ["snappy"]
default = [
    "aws",
    "foyer",
]
foyer = ["dep:foyer"]
gcp = ["object_store/gcp"]
lz4 = ["dep:lz4_flex"]
moka = ["dep:moka"]
snappy = ["dep:snap"]
test-util = [
    "tokio/test-util",
    "slatedb-common/test-util",
    "slatedb-txn-obj/test-util",
]
wal_disable = []
zlib = ["dep:flate2"]
zstd = ["dep:zstd"]

[lib]
name = "slatedb"
path = "src/lib.rs"
bench = false

[[test]]
name = "configurable_block_size"
path = "tests/configurable_block_size.rs"

[[test]]
name = "custom_wal"
path = "tests/custom_wal.rs"

[[test]]
name = "db"
path = "tests/db.rs"

[[test]]
name = "foyer_cache_flush"
path = "tests/foyer_cache_flush.rs"
required-features = ["foyer"]

[[test]]
name = "prefix_filter"
path = "tests/prefix_filter.rs"

[[test]]
name = "range_filter"
path = "tests/range_filter.rs"

[[test]]
name = "scan_model"
path = "tests/scan_model.rs"

[[test]]
name = "transactions"
path = "tests/transactions.rs"

[[test]]
name = "leadership_lifecycle"
path = "tests/leadership_lifecycle.rs"

[[bench]]
name = "block_iterator_v2"
path = "benches/block_iterator_v2.rs"
harness = false
required-features = ["bench-internal"]

[[bench]]
name = "db_operations"
path = "benches/db_operations.rs"
harness = false

[[bench]]
name = "db_transaction"
path = "benches/db_transaction.rs"
harness = false

[[bench]]
name = "scan_prefix_bench"
