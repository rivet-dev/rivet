[build]
rustflags = ["--cfg", "tokio_unstable"]

# Target-specific flags must repeat tokio_unstable because target rustflags
# override [build] rustflags. The link args are required on macOS for native
# Node.js addons (dynamic_lookup defers symbol resolution to runtime).
[target.aarch64-apple-darwin]
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[target.x86_64-apple-darwin]
rustflags = [
    "--cfg", "tokio_unstable",
    "-C", "link-arg=-undefined",
    "-C", "link-arg=dynamic_lookup",
]

[env]
# SQLite otherwise reads overflow pages straight from the file, bypassing its page cache. The VFS
# hands each buffered page over once, so large rows would go back to the engine on every read.
LIBSQLITE3_FLAGS = "SQLITE_ENABLE_BATCH_ATOMIC_WRITE SQLITE_DIRECT_OVERFLOW_READ=0"

# Browser builds of the simulator. getrandom needs its JS backend selected explicitly.
[target.wasm32-unknown-unknown]
rustflags = [
    "--cfg", "tokio_unstable",
    "--cfg", 'getrandom_backend="wasm_js"',
]
