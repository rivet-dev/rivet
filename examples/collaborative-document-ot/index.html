<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Document (OT) Example</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f5f1e8;
            --surface: #ffffff;
            --border: #e2d8c7;
            --text: #1f2a37;
            --muted: #6b7280;
            --accent: #0f766e;
            --shadow: 0 18px 60px rgba(15, 23, 42, 0.12);
            --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
            --sans: system-ui, "Segoe UI", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: var(--sans);
            color: var(--text);
            background: var(--bg);
            min-height: 100vh;
        }

        #root {
            max-width: 960px;
            margin: 0 auto;
            padding: 48px 24px 72px;
        }

        .page {
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .hero {
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-start;
            justify-content: space-between;
        }

        .hero h1 {
            margin: 12px 0;
            font-size: clamp(1.8rem, 4vw, 2.6rem);
        }

        .hero p {
            max-width: 520px;
            color: var(--muted);
            line-height: 1.6;
        }

        .eyebrow {
            text-transform: uppercase;
            letter-spacing: 0.2em;
            font-size: 0.75rem;
            color: var(--accent);
            font-weight: 600;
        }

        .hero-card {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 16px;
            min-width: 240px;
            box-shadow: var(--shadow);
            display: grid;
            gap: 6px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        input {
            font: inherit;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
        }

        .editor {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px;
            box-shadow: var(--shadow);
            display: grid;
            gap: 16px;
        }

        .editor-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .editor-header h2 {
            margin: 0;
        }

        .editor-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f59e0b;
        }

        .status-dot.online {
            background: #10b981;
        }

        textarea {
            width: 100%;
            min-height: 360px;
            padding: 18px;
            font-family: var(--mono);
            font-size: 0.95rem;
            line-height: 1.6;
            border-radius: 16px;
            border: 1px solid var(--border);
            resize: vertical;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/frontend/main.tsx"></script>
</body>
</html>
