<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Manrope', ui-sans-serif, system-ui, sans-serif">
  <defs>
    <style>
      .eyebrow { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 2.2px; fill: #2E4034; text-transform: uppercase; }
      .panel-title { font-size: 21px; font-weight: 600; fill: #262220; }
      .layer-lbl { font-size: 15px; font-weight: 600; fill: #4A4440; }
      .agent-lbl { font-size: 15px; font-weight: 600; fill: #23372B; }
      .chip-lbl { font-size: 12.5px; font-weight: 600; fill: #23372B; }
      .stat { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: #8A827B; }
      .stat-strong { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 14px; fill: #262220; font-weight: 600; }
      .runtime-lbl { font-size: 15px; font-weight: 600; fill: #FBFAF9; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#EFEFEF"/>

  <text x="48" y="46" class="eyebrow">Fig. 01 — Isolate model for sandboxes</text>

  <!-- ============ LEFT: traditional sandbox ============ -->
  <rect x="48" y="72" width="516" height="480" rx="16" fill="#FBFAF9" stroke="#26222020"/>
  <text x="76" y="118" class="panel-title">Traditional sandbox</text>
  <text x="76" y="144" class="stat">one virtual machine per agent</text>

  <!-- three VM stacks -->
  <g>
    <!-- column template repeated 3x -->
    <!-- col 1 -->
    <g transform="translate(76,172)">
      <rect x="0" y="0" width="128" height="52" rx="7" fill="#DDE4DC" stroke="#2E403455"/>
      <text x="64" y="31" text-anchor="middle" class="agent-lbl">Agent</text>
      <rect x="0" y="60" width="128" height="70" rx="7" fill="#ECEAE7" stroke="#26222018"/>
      <text x="64" y="99" text-anchor="middle" class="layer-lbl">Guest OS</text>
      <rect x="0" y="138" width="128" height="60" rx="7" fill="#E6E3E0" stroke="#26222018"/>
      <text x="64" y="172" text-anchor="middle" class="layer-lbl">Kernel</text>
      <rect x="0" y="206" width="128" height="82" rx="7" fill="#DFDBD7" stroke="#26222018"/>
      <text x="64" y="243" text-anchor="middle" class="layer-lbl">Virtual</text>
      <text x="64" y="262" text-anchor="middle" class="layer-lbl">hardware</text>
    </g>
    <!-- col 2 -->
    <g transform="translate(220,172)">
      <rect x="0" y="0" width="128" height="52" rx="7" fill="#DDE4DC" stroke="#2E403455"/>
      <text x="64" y="31" text-anchor="middle" class="agent-lbl">Agent</text>
      <rect x="0" y="60" width="128" height="70" rx="7" fill="#ECEAE7" stroke="#26222018"/>
      <text x="64" y="99" text-anchor="middle" class="layer-lbl">Guest OS</text>
      <rect x="0" y="138" width="128" height="60" rx="7" fill="#E6E3E0" stroke="#26222018"/>
      <text x="64" y="172" text-anchor="middle" class="layer-lbl">Kernel</text>
      <rect x="0" y="206" width="128" height="82" rx="7" fill="#DFDBD7" stroke="#26222018"/>
      <text x="64" y="243" text-anchor="middle" class="layer-lbl">Virtual</text>
      <text x="64" y="262" text-anchor="middle" class="layer-lbl">hardware</text>
    </g>
    <!-- col 3 -->
    <g transform="translate(364,172)">
      <rect x="0" y="0" width="128" height="52" rx="7" fill="#DDE4DC" stroke="#2E403455"/>
      <text x="64" y="31" text-anchor="middle" class="agent-lbl">Agent</text>
      <rect x="0" y="60" width="128" height="70" rx="7" fill="#ECEAE7" stroke="#26222018"/>
      <text x="64" y="99" text-anchor="middle" class="layer-lbl">Guest OS</text>
      <rect x="0" y="138" width="128" height="60" rx="7" fill="#E6E3E0" stroke="#26222018"/>
      <text x="64" y="172" text-anchor="middle" class="layer-lbl">Kernel</text>
      <rect x="0" y="206" width="128" height="82" rx="7" fill="#DFDBD7" stroke="#26222018"/>
      <text x="64" y="243" text-anchor="middle" class="layer-lbl">Virtual</text>
      <text x="64" y="262" text-anchor="middle" class="layer-lbl">hardware</text>
    </g>
  </g>

  <line x1="76" y1="500" x2="536" y2="500" stroke="#26222015"/>
  <text x="76" y="528" class="stat"><tspan class="stat-strong">~1 GiB</tspan> per agent</text>
  <text x="536" y="528" text-anchor="end" class="stat"><tspan class="stat-strong">440 ms</tspan> cold start</text>

  <!-- ============ CENTER arrow ============ -->
  <g transform="translate(600,300)">
    <path d="M -14 -18 L 16 0 L -14 18" fill="none" stroke="#D63E00" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============ RIGHT: agentOS ============ -->
  <rect x="636" y="72" width="516" height="480" rx="16" fill="#FBFAF9" stroke="#26222020"/>
  <text x="664" y="118" class="panel-title">agentOS</text>
  <text x="664" y="144" class="stat">isolates share one runtime</text>

  <!-- isolate chips grid: 4 cols x 3 rows -->
  <g transform="translate(664,168)">
    <!-- row 1 -->
    <g>
      <rect x="0"   y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="53"  y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="118" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="171" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="236" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="289" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="354" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="407" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
    </g>
    <!-- row 2 -->
    <g transform="translate(0,54)">
      <rect x="0"   y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="53"  y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="118" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="171" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="236" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="289" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="354" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="407" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
    </g>
    <!-- row 3 -->
    <g transform="translate(0,108)">
      <rect x="0"   y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="53"  y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="118" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="171" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="236" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="289" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
      <rect x="354" y="0" width="106" height="42" rx="7" fill="#DDE4DC" stroke="#2E403455"/><text x="407" y="27" text-anchor="middle" class="chip-lbl">Agent</text>
    </g>
  </g>

  <!-- shared runtime + host -->
  <rect x="664" y="344" width="460" height="52" rx="8" fill="#2E4034"/>
  <text x="894" y="376" text-anchor="middle" class="runtime-lbl">WebAssembly + V8 runtime</text>
  <rect x="664" y="404" width="460" height="48" rx="8" fill="#E6E3E0" stroke="#26222018"/>
  <text x="894" y="434" text-anchor="middle" class="layer-lbl">Your backend process</text>

  <line x1="664" y1="500" x2="1124" y2="500" stroke="#26222015"/>
  <text x="664" y="528" class="stat"><tspan class="stat-strong">~22 MB</tspan> per agent</text>
  <text x="1124" y="528" text-anchor="end" class="stat"><tspan class="stat-strong">4.8 ms</tspan> cold start</text>
</svg>
