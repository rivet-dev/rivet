# Real I/O: SlateDB cold stores, UPS transport, S3 and engine config. The simulator
# builds only the coordinator state machine for wasm32 and supplies its own I/O.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-util.workspace = true
depot-client.workspace = true
object_store = { workspace = true, features = ["aws", "fs"] }
rivet-config.workspace = true
rivet-env = { workspace = true, features = ["slatedb"] }
slatedb = { version = "0.17.0", features = ["wal_disable", "compaction_filters"] }
slatedb-common = "0.17.0"
universalpubsub.workspace = true

