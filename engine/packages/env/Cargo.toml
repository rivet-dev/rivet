[package]
name = "rivet-env"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true

[features]
slatedb = ["dep:slatedb", "dep:slatedb-common", "dep:chrono", "dep:async-trait"]
default = []

[dependencies]
http.workspace = true
slatedb = { version = "0.17.0", optional = true, features = ["lz4", "compaction_filters"] }
slatedb-common = { version = "0.17.0", optional = true }
futures-util.workspace = true

lazy_static.workspace = true
rivet-metrics.workspace = true
tower = { workspace = true, features = ["util"] }
uuid.workspace = true
serde.workspace = true
anyhow.workspace = true
chrono = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, features = ["serde"] }
object_store.workspace = true
parking_lot.workspace = true
rand.workspace = true
rand_chacha = "0.3"
blake3 = "1"
tokio.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true

# wasm32 compile without it, so these stay native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
object_store = { workspace = true, features = ["aws", "azure", "gcp"] }
axum = { workspace = true, features = ["ws"] }
hyper-util.workspace = true
libc.workspace = true
reqwest = { workspace = true, features = ["stream", "http2"] }
tokio = { workspace = true, features = ["full"] }

