[package]
name = "rivet-engine"
publish = false
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
autolib = false
# Integration tests are declared explicitly below.
autotests = false

[[bin]]
name = "rivet-engine"
path = "src/main.rs"

[features]
# Load-run builds: sampled jemalloc heap profiling, dumped on SIGUSR2.
heap-profile = ["tikv-jemallocator/profiling", "tikv-jemalloc-sys/profiling"]

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { workspace = true, features = ["stats"] }
tikv-jemalloc-sys = { workspace = true, features = ["stats"] }

[dependencies]
rivet-auth-jwt.workspace = true
prometheus.workspace = true
vbare.workspace = true
depot-protocol.workspace = true
foundationdb-tuple.workspace = true
axum.workspace = true
tower.workspace = true
async-trait.workspace = true
tokio-util.workspace = true
epoxy.workspace = true
bytes.workspace = true
rivet-keys.workspace = true
depot-client.workspace = true
depot-fs-core.workspace = true
rivet-api-peer.workspace = true
depot-types = { path = "../depot-types" }
depot-volume = { path = "../depot-volume" }
rivet-data.workspace = true
rivet-singleton-coordinator.workspace = true
rivet-metrics.workspace = true
rivet-metrics-server.workspace = true
object_store.workspace = true
lazy_static.workspace = true
rivet-env.workspace = true
anyhow.workspace = true
clap.workspace = true
rivet-topology.workspace = true
depot-worker.workspace = true
futures-util.workspace = true
hex.workspace = true
pegboard.workspace = true
rivet-build-meta.workspace = true
rivet-config.workspace = true
rivet-cluster-config.workspace = true
rivet-guard.workspace = true
rivet-engine-context.workspace = true
rivet-runtime.workspace = true
rivet-service-manager.workspace = true
rivet-telemetry.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
universalpubsub.workspace = true
uuid.workspace = true

[[example]]
name = "actor-v3-cluster"
path = "../../tests/actor-v3/cluster.rs"

# Runs the actor v3 cluster example as a subprocess, so `cargo test` builds the example first.
